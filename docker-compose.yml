services:
  db:
    image: postgres:16-alpine
    container_name: prefix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prefix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefix}
      POSTGRES_DB: ${POSTGRES_DB:-prefix_delegation}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prefix} -d ${POSTGRES_DB:-prefix_delegation}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: prefix-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prefix}:${POSTGRES_PASSWORD:-prefix}@db:5432/${POSTGRES_DB:-prefix_delegation}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
