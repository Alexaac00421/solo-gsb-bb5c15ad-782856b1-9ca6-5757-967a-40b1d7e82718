services:
  db:
    image: postgres:16-alpine
    container_name: prefix-deleg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deleg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deleg}
      POSTGRES_DB: ${POSTGRES_DB:-delegation}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deleg} -d ${POSTGRES_DB:-delegation}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: prefix-deleg-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-deleg}:${POSTGRES_PASSWORD:-deleg}@db:5432/${POSTGRES_DB:-delegation}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
